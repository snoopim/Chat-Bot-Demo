<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Pledging Flow</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #ffffff;
    width: 660px;
    height: 492px;
  }
  svg { display: block; }
</style>

<body>

  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="116%">

  <!-- Edges -->
  <path d="M 464.0 170.0 L 464.0 242.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)" style="stroke-linejoin: round; stroke-linecap: round;"/><path d="M 379.0 267.0 L 309.0 267.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)" style="stroke-linejoin: round; stroke-linecap: round;"/><path d="M 224.0 292.0 L 224.0 328.0 L 344.0 328.0 L 344.0 364.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)" style="stroke-linejoin: round; stroke-linecap: round;"/><path d="M 358.0 364.0 L 358.0 267.0 L 224.0 267.0 L 224.0 170.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)" style="stroke-linejoin: round; stroke-linecap: round;"/>

  <rect x="468.0" y="198.0" width="70" height="16" rx="3" ry="3" fill="#ffffff" fill-opacity="0.9" stroke="#ccc" stroke-width="0.8"/><text x="503.0" y="209.0" text-anchor="middle" font-size="8" font-weight="600" fill="#444" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Submission</text><rect x="318.0" y="248.0" width="52" height="16" rx="3" ry="3" fill="#ffffff" fill-opacity="0.9" stroke="#ccc" stroke-width="0.8"/><text x="344.0" y="259.0" text-anchor="middle" font-size="8" font-weight="600" fill="#444" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Pledges</text><rect x="261.0" y="309.0" width="46" height="16" rx="3" ry="3" fill="#ffffff" fill-opacity="0.9" stroke="#ccc" stroke-width="0.8"/><text x="284.0" y="320.0" text-anchor="middle" font-size="8" font-weight="600" fill="#444" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Export</text><rect x="250.0" y="208.0" width="82" height="16" rx="3" ry="3" fill="#ffffff" fill-opacity="0.9" stroke="#ccc" stroke-width="0.8"/><text x="291.0" y="219.0" text-anchor="middle" font-size="8" font-weight="600" fill="#444" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Instructions</text>
